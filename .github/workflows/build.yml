name: Build Anamne
on:
  # Manual only: the owner builds locally while Actions minutes are exhausted.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: bash tool/bootstrap.sh
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: anamne-web
          path: build/web/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: bash tool/bootstrap.sh
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: anamne-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev liblzma-dev libglu1-mesa
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: bash tool/bootstrap.sh
      - run: flutter build linux --release
      - run: |
          curl -fL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          APPIMAGETOOL=/tmp/appimagetool.AppImage APPIMAGE_EXTRACT_AND_RUN=1 bash tool/package_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anamne-linux-appimage
          path: build/appimage/Anamne-x86_64.AppImage
